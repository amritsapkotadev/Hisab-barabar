workflows:
  expo-android:
    name: Expo Android APKs
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v22.11.0
      java: 17
      vars:
        APP_DIR: "mobile-app"
    scripts:
      - name: Install dependencies
        script: cd "$CM_BUILD_DIR/$APP_DIR" && npm ci
      - name: Prebuild
        script: cd "$CM_BUILD_DIR/$APP_DIR" && npx expo prebuild --platform android --no-install
      - name: Set SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/$APP_DIR/android/local.properties"
      - name: Build development and standalone testing APKs
        script: cd "$CM_BUILD_DIR/$APP_DIR/android" && ./gradlew assembleDebug assembleRelease
    artifacts:
      - mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
      - mobile-app/android/app/build/outputs/apk/release/app-release.apk
