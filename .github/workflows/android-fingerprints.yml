name: Android signing fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show test signing certificate fingerprints
        run: >-
          keytool -list -v
          -keystore mobile-app/android/app/debug.keystore
          -alias androiddebugkey
          -storepass android
