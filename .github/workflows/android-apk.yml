name: Android testing APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: https://hisabbarabar.qzz.io/api
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build development and standalone testing APKs
        working-directory: mobile-app/android
        run: >-
          bash ./gradlew :app:assembleDebug :app:assembleRelease
          --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'

      - name: Upload development APK (requires Metro)
        uses: actions/upload-artifact@v4
        with:
          name: hisab-barabar-development-${{ github.run_number }}
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone testing APK (no Metro)
        uses: actions/upload-artifact@v4
        with:
          name: hisab-barabar-standalone-testing-${{ github.run_number }}
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
